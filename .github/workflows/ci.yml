name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify production Supabase env guard
        run: |
          set +e
          npm run build > /tmp/missing-supabase-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected production build to fail without Supabase env vars."
            exit 1
          fi
          grep -q "Production Supabase configuration is missing" /tmp/missing-supabase-build.log

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
